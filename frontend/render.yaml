services:
  - type: web
    name: stemai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: DEMUCS_MODEL
        value: htdemucs_ft
      - key: FIREBASE_STORAGE_BUCKET
        value: vocal-separater-5eb7c.firebasestorage.app

